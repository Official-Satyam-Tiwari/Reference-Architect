[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biblioaudit"
version = "2.2.0"
authors = [
  { name="Satyam Tiwari", email="satyam.tiwari@doctoral.uj.edu.pl" },
]
description = "Automated reference integrity and citation verification tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "bibtexparser",
    "aiohttp",
    "pandas",
    "xmltodict",
    "doi2bib",
]

[project.scripts]
biblioaudit = "biblioaudit:main"

[project.urls]
"Homepage" = "https://github.com/Official-Satyam-Tiwari/Reference-Architect"
"Bug Tracker" = "https://github.com/Official-Satyam-Tiwari/Reference-Architect/issues"

[tool.setuptools]
py-modules = ["biblioaudit", "utility"]
